<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Umar Shaikh | Software Engineering Student & Developer</title>
    <meta
      name="description"
      content="Portfolio of Muhammad Umar Shaikh, a Software Engineering student building software projects and exploring full-stack development, AI, and modern technologies."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Matches the site's dark background so the browser UI doesn't show white on mobile -->
    <meta name="theme-color" content="#0B0908" />

    <!-- Fonts loaded here (not from inside React) so they're discovered by the
         browser's preloader immediately, instead of only after JS runs -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / social share preview (LinkedIn, WhatsApp, etc.) -->
    <!-- PLACEHOLDER: once your Vercel URL or custom domain is final, update og:url below -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://umar-portfolio-alpha.vercel.app" />
    <meta property="og:title" content="Muhammad Umar Shaikh | Software Engineering Student & Developer" />
    <meta
      property="og:description"
      content="Portfolio of Muhammad Umar Shaikh, a Software Engineering student building software projects and exploring full-stack development, AI, and modern technologies."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
